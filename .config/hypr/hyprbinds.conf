# hyprland @ Keybinds
# Wiki: https://wiki.hypr.land/Configuring/Binds - https://wiki.hypr.land/Configuring/Keywords

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, loginctl terminate-user $USER
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, K, togglesplit, # dwindle
bind = $mainMod SHIFT, J, layoutmsg, swapsplit # dwindle
bind = $mainMod, F, exec, $browser
bind = $mainMod, Z, exec, $zed
bind = $mainMod SHIFT, c, exec, hyprpicker | xargs wl-copy
bind = $mainMod, X,  exec, $taskManager
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout all next && notify-send "Switched Layout:" "$(hyprctl devices -j | jq -r '.keyboards[] | .active_keymap' | head -n1 | cut -c1-2 | tr 'A-Z' 'a-z')" -t 1000
bind = $mainMod, W, exec, $waybar
bind = SHIFT, PRINT, exec, grim -g "$(slurp -c 'ee5396ff')" && notify-send "Screenshot saved" -t 2000
bind = , PRINT, exec, grim && notify-send "Screenshot saved" -t 2000
bind = , F11, fullscreen

# Window movement/management
binde = $mainMod, Tab, cyclenext
binde = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod CTRL, H, movefocus, l
bind = $mainMod CTRL, L, movefocus, r
bind = $mainMod CTRL, K, movefocus, u
bind = $mainMod CTRL, J, movefocus, d

bind = $mainMod, Tab, alterzorder, top
bind = $mainMod SHIFT, Tab, alterzorder, top
bind = $mainMod CTRL, H, alterzorder, top
bind = $mainMod CTRL, L, alterzorder, top
bind = $mainMod CTRL, K, alterzorder, top
bind = $mainMod CTRL, J, alterzorder, top

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde = $mainMod SHIFT, L, resizeactive, 30 0
binde = $mainMod SHIFT, H, resizeactive, -30 0

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && $notify vol
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $notify vol
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $notify vol
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && $notify brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && $notify brightness
bind = $mainMod, B, dpms, toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
