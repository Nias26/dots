# hyprland @ windowrules
# Wiki: https://wiki.hypr.land/Configuring/Window-Rules - https://wiki.hypr.land/Configuring/Workspace-Rules

windowrule {
  name = suppress-maximize-events
  match:class = .*

  suppress_event = maximize
}

windowrule {
  name = custom-opacity-override-over-class
  match:class = ^(dev.zed.Zed|jetbrains-idea|com.github.th_ch.youtube_music)$

  opacity = 0.9 override
}
windowrule = match:class ^(gimp)$, opacity 1.0 override 1.0 override 1.0 override, no_blur true

windowrule {
  name = custom-opacity-override-over-title
  match:title = ^(superfile)$

  opacity = 0.8 override
}

windowrule {
  name = floating-windows-size-position
  match:float = true
  match:xwayland = false

  # size = 700 500
  center = true
}

windowrule {
  name = make-floating
  match:class = ^(file-jpeg)$

  float = true
}
windowrule = match:class ^(steam)$, match:title ^(steam)?.*, float true

windowrule {
  name = fix-xwayland-drags
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false

  no_focus = true
}

windowrule {
  name = fix-xwayland-blur
  match:float = true
  match:xwayland = true

  opacity = 1.0 override
  no_blur = true
}
