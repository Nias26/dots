# hyprland @ windowrules
# Wiki: https://wiki.hypr.land/Configuring/Window-Rules - https://wiki.hypr.land/Configuring/Workspace-Rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Floating rule for xdg popups
windowrule = float, class:(X|x)dg-desktop-portal.*
windowrule = float, class:zenity
windowrule = float, class:firefox, title:(Libreria)

# Disable gaps in fullscreen
workspace = f[1], gapsout:0, gapsin:0

# Set xdg-portal popup size
windowrulev2 = size 700 500,class:((X|x)dg-desktop-portal.*)
windowrulev2 = size 700 500, class:gimp, title:(Apri immagine)

# Kando
windowrule = noblur, class:kando
windowrule = opaque, class:kando
windowrule = size 100% 100%, class:kando
windowrule = noborder, class:kando
windowrule = noanim, class:kando
windowrule = float, class:kando
windowrule = pin, class:kando
