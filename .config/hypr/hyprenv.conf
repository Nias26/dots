# hyprland @ environment
# Wiki: https://wiki.hypr.land/Configuring/Environment-variables

# Using uwsm! See ~/.config/uwsm/env and env-hyprland

$terminal = kitty
$fileManager = kitty -e spf
$taskManager = kitty -e btop
$menu = vicinae toggle
$browser = zen-browser
$zed = zeditor
$waybar = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/styles/style.css
$notify = $HOME/.config/hypr/scripts/notify
