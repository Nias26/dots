general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  inhibit_sleep = 3
}

listener {
    timeout = 15                                                                    # 15sec.
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0                      # turn off keyboard backlight.
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 150                                                                   # 2.5min.
    on-timeout = brightnessctl -s set 10                                            # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                                                   # 5.0min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                                   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}
